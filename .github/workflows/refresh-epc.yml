name: Refresh EPC retrofit map

# Monthly refresh of the EPC retrofit-market leaderboard from the FULL MHCLG
# domestic register (every certificate in England and Wales, latest per home).
# scripts/ingest-epc-bulk.py downloads the ~8 GB full-load zip, streams it,
# and rewrites src/data/epc-snapshot.json. Needs EPC_API_TOKEN as a repo secret.
# The register's bulk file is regenerated monthly, so weekly runs would be noise.

on:
  schedule:
    - cron: "0 6 3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet numpy pandas
      - name: Free disk space for the 8 GB download
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h / /tmp "$RUNNER_TEMP"
      - name: Run full-register EPC ingest
        env:
          EPC_API_TOKEN: ${{ secrets.EPC_API_TOKEN }}
          # /tmp on the hosted runner is small; the 8 GB zip must land on the
          # main disk, which is where the runner's work dir lives.
          TMPDIR: ${{ runner.temp }}
        run: python3 scripts/ingest-epc-bulk.py
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/epc-snapshot.json
          if git diff --staged --quiet; then
            echo "No changes - EPC distribution unchanged this month."
          else
            git commit -m "chore: refresh EPC retrofit snapshot (full register) [skip ci]"
            git push
          fi
